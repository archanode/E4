[build]
  command = "npm run build"
  publish = "dist"

# No SPA catch-all: every route is prerendered (scripts/prerender.mjs), so
# Netlify serves the matching .html file directly, and any unknown path gets
# dist/404.html with a real 404 status.
#
# Trailing slashes: pages are built as <route>.html, so Netlify serves /about
# and 301-redirects /about/ to /about (no-slash is the canonical form).

# Canonical host: www -> apex, permanent.
[[redirects]]
  from = "https://www.e4chess.academy/*"
  to = "https://e4chess.academy/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.e4chess.academy/*"
  to = "https://e4chess.academy/:splat"
  status = 301
  force = true
